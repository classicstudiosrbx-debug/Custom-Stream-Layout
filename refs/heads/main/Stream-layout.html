<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Stream Layout</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap');

  @property --a { syntax: '<angle>'; inherits: false; initial-value: 0deg; }

  :root {
    --h: 280;
    --c1: hsl(var(--h) 100% 62%);
    --c2: hsl(calc(var(--h) + 70) 100% 60%);
    --c3: hsl(calc(var(--h) + 140) 100% 62%);
    --card: rgba(10, 8, 22, .86);
  }

  html, body { margin: 0; width: 1920px; height: 1080px; background: transparent; overflow: hidden; }
  * { box-sizing: border-box; }

  /* ---------- rotating gradient frames (game + cam), see-through inside ---------- */
  .frame {
    position: absolute; border-radius: 20px; overflow: hidden; z-index: 1;
    box-shadow: 0 0 30px color-mix(in srgb, var(--c1) 50%, transparent),
                0 0 60px color-mix(in srgb, var(--c2) 28%, transparent);
  }
  .frame::before {
    content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 4px;
    background: conic-gradient(from var(--a), var(--c1), var(--c2), var(--c3), var(--c1));
    animation: spin 7s linear infinite;
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
            mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
            mask-composite: exclude;
  }
  @keyframes spin { to { --a: 360deg; } }

  #game { left: 22px; top: 22px; width: 1536px; height: 864px; transition: width 0.3s ease; }
  #cam  { left: 1584px; top: 30px; width: 312px;  height: 312px; transition: opacity 0.3s ease; }

  /* polished corner brackets on the game frame */
  .corner { position: absolute; width: 46px; height: 46px; border: 2px solid rgba(255,255,255,.94);
            z-index: 2; filter: drop-shadow(0 0 6px var(--c2)); }
  .corner::before { content: ""; position: absolute; width: 14px; height: 2px;
                    background: var(--c2); box-shadow: 0 0 8px var(--c2); }
  .corner::after { content: ""; position: absolute; width: 6px; height: 6px; border-radius: 50%;
                   background: var(--c3); box-shadow: 0 0 9px var(--c3); }
  .corner.tl { top: 16px; left: 16px; border-right: 0; border-bottom: 0; border-top-left-radius: 12px; }
  .corner.tl::before { top: -2px; right: 8px; }
  .corner.tl::after { top: -4px; left: -4px; }
  .corner.tr { top: 16px; right: 16px; border-left: 0; border-bottom: 0; border-top-right-radius: 12px; }
  .corner.tr::before { top: -2px; left: 8px; }
  .corner.tr::after { top: -4px; right: -4px; }
  .corner.bl { bottom: 16px; left: 16px; border-right: 0; border-top: 0; border-bottom-left-radius: 12px; }
  .corner.bl::before { bottom: -2px; right: 8px; }
  .corner.bl::after { bottom: -4px; left: -4px; }
  .corner.br { bottom: 16px; right: 16px; border-left: 0; border-top: 0; border-bottom-right-radius: 12px; }
  .corner.br::before { bottom: -2px; left: 8px; }
  .corner.br::after { bottom: -4px; right: -4px; }

  /* ---------- cards ---------- */
  .card {
    position: absolute; border-radius: 22px; overflow: hidden;
    background:
      radial-gradient(120% 140% at 0% 0%, color-mix(in srgb, var(--c1) 22%, transparent), transparent 55%),
      radial-gradient(120% 140% at 100% 100%, color-mix(in srgb, var(--c3) 20%, transparent), transparent 55%),
      var(--card);
    box-shadow: 0 0 0 2px color-mix(in srgb, var(--c2) 45%, transparent),
                0 0 30px color-mix(in srgb, var(--c1) 30%, transparent);
    transition: all 0.3s ease;
  }
  .card::after { /* light sweep */
    content: ""; position: absolute; top: 0; bottom: 0; width: 70px; left: -120px;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,.12), transparent);
    transform: skewX(-18deg); animation: sweep 6s ease-in-out infinite;
  }
  @keyframes sweep { 0%, 60% { left: -120px; } 100% { left: 115%; } }

  .label {
    font: 700 16px/1 'Rajdhani', sans-serif; letter-spacing: .45em; text-transform: uppercase;
    color: var(--c2); text-shadow: 0 0 20px var(--c2); padding-left: .45em;
  }
  .glow {
    font-family: 'Orbitron', monospace; font-weight: 900; color: #fff; font-variant-numeric: tabular-nums;
    text-shadow: 0 0 6px #fff, 0 0 18px var(--c1), 0 0 38px var(--c1), 0 0 64px var(--c2);
  }

  /* ---------- clock card ---------- */
  #clock { left: 1584px; top: 360px; width: 312px; height: 252px; display: flex; flex-direction: column;
           align-items: center; justify-content: center; gap: 10px; }
  
  #time { font-size: 56px; line-height: 1; }
  #time .colon { color: var(--c2); animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: .15; } }
  #date { font: 600 20px/1 'Rajdhani', sans-serif; letter-spacing: .26em; color: rgba(255,255,255,.8); padding-left: .26em; }
  #bar { width: 240px; height: 6px; border-radius: 6px; background: rgba(255,255,255,.1); overflow: hidden; margin-top: 4px; }
  #fill { height: 100%; width: 0; border-radius: 6px; background: linear-gradient(90deg, var(--c1), var(--c2), var(--c3)); box-shadow: 0 0 12px var(--c2); }

  /* ---------- timer card (uptime / countdown) ---------- */
  #timerCard { left: 1584px; top: 636px; width: 312px; height: 252px; display: flex; flex-direction: column;
               align-items: center; justify-content: center; gap: 10px; }
  #ringwrap { position: relative; width: 176px; height: 176px; }
  #ringwrap svg { position: absolute; inset: 0; transform: rotate(-90deg); }
  #timerTxt { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 25px; }
  #ring { filter: drop-shadow(0 0 6px var(--c2)); }

  /* ---------- bottom title strip ---------- */
  #strip { left: 30px; top: 912px; width: 1872px; height: 144px; display: flex; align-items: center; padding: 0 40px; gap: 32px; }
  #live { display: flex; align-items: center; gap: 12px; padding: 12px 22px; border-radius: 40px;
          background: color-mix(in srgb, var(--c1) 22%, transparent);
          border: 2px solid var(--c1); font: 700 22px/1 'Rajdhani', sans-serif; letter-spacing: .3em; color: #fff; }
  #live i { width: 14px; height: 14px; border-radius: 50%; background: #ff3b5c; box-shadow: 0 0 14px #ff3b5c; animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(.55); opacity: .5; } }
  #titles { flex: 1; min-width: 0; }
  #title { font: 900 52px/1.1 'Orbitron', monospace; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
           text-shadow: 0 0 12px var(--c1), 0 0 34px var(--c1); }
  #game-name { margin-top: 10px; font: 700 26px/1 'Rajdhani', sans-serif; letter-spacing: .4em; text-transform: uppercase; color: var(--c3);
               text-shadow: 0 0 10px var(--c3); }
  #eq { display: flex; align-items: flex-end; gap: 6px; height: 80px; }
  #eq b { width: 10px; border-radius: 5px; background: linear-gradient(to top, var(--c1), var(--c2), var(--c3));
          box-shadow: 0 0 10px color-mix(in srgb, var(--c2) 70%, transparent);
          height: 20%; animation: eq 1s ease-in-out infinite alternate; }
  @keyframes eq { to { height: 100%; } }

  /* ---------- status tab ---------- */
  #status {
    display: none;
    position: absolute; left: 792px; top: 2px; transform: translateX(-50%);
    z-index: 10; align-items: center; gap: 14px; padding: 12px 34px; border-radius: 40px;
    background:
      linear-gradient(135deg, color-mix(in srgb, var(--c1) 30%, transparent), color-mix(in srgb, var(--c3) 25%, transparent)),
      var(--card);
    box-shadow: 0 0 0 2px var(--c2), 0 0 26px color-mix(in srgb, var(--c1) 60%, transparent);
    font: 700 28px/1 'Orbitron', monospace; letter-spacing: .22em; text-transform: uppercase; color: #fff;
    text-shadow: 0 0 10px var(--c1), 0 0 24px var(--c2);
    white-space: nowrap; padding-left: calc(34px + .22em);
    animation: statusIn .5s cubic-bezier(.2,1.5,.4,1), statusFloat 3s ease-in-out .5s infinite;
  }
  #status::before {
    content: ""; width: 14px; height: 14px; border-radius: 50%; flex: none;
    background: var(--c3); box-shadow: 0 0 14px var(--c3); animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes statusIn { from { opacity: 0; transform: translate(-50%, -30px) scale(.7); } }
  @keyframes statusFloat { 50% { transform: translate(-50%, 4px); } }

  /* Optional plain theme: preserve the layout and colors while removing glow and motion. */
  body.no-neon .frame,
  body.no-neon .card { box-shadow: none !important; }
  body.no-neon .frame::before,
  body.no-neon .card::after { display: none !important; }
  body.no-neon .corner,
  body.no-neon #ring,
  body.no-neon #fill { filter: none !important; box-shadow: none !important; }
  body.no-neon .corner::before,
  body.no-neon .corner::after { box-shadow: none !important; }
  body.no-neon .label,
  body.no-neon .glow,
  body.no-neon #title,
  body.no-neon #game-name,
  body.no-neon #status { text-shadow: none !important; }
  body.no-neon #time .colon,
  body.no-neon #live i,
  body.no-neon #eq b,
  body.no-neon #status,
  body.no-neon #status::before { animation: none !important; box-shadow: none !important; }
</style>
</head>

<body translate="no">

  <!-- solid black backdrop with see-through holes -->
  <svg id="bg" width="1920" height="1080" viewBox="0 0 1920 1080" style="position:absolute;left:0;top:0">
    <path id="bg-path" fill="#000" fill-rule="evenodd" d="
      M0 0 H1920 V1080 H0 Z
      M46 24 H1538 A22 30 0 0 1 1560 46 V866 A22 22 0 0 1 1538 888 H46 A22 30 0 0 1 24 866 V46 A22 30 0 0 1 46 24 Z
      M1606 24 H1874 A22 30 0 0 1 1896 46 V314 A22 22 0 0 1 1874 336 H1606 A22 30 0 0 1 1584 314 V46 A22 30 0 0 1 1606 24 Z"/>
  </svg>

  <div class="frame" id="game">
    <div class="corner tl"></div><div class="corner tr"></div>
    <div class="corner bl"></div><div class="corner br"></div>
  </div>
  <div class="frame" id="cam"></div>

  <div id="status"></div>

  <div class="card" id="clock">
    <div class="label" id="day"></div>
    <div class="glow" id="time"></div>
    <div id="date"></div>
    <div id="bar"><div id="fill"></div></div>
  </div>

  <div class="card" id="timerCard">
    <div class="label" id="timerLabel">Time Live</div>
    <div id="ringwrap">
      <svg width="176" height="176" viewBox="0 0 176 176">
        <circle cx="88" cy="88" r="78" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="8"/>
        <circle id="ring" cx="88" cy="88" r="78" fill="none" stroke="url(#g)" stroke-width="8" stroke-linecap="round"
                stroke-dasharray="490.1" stroke-dashoffset="490.1"/>
        <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="hsl(var(--h) 100% 62%)"/><stop offset="1" stop-color="hsl(calc(var(--h) + 140) 100% 62%)"/>
        </linearGradient></defs>
      </svg>
      <div class="glow" id="timerTxt">00:00:00</div>
    </div>
  </div>

  <div class="card" id="strip">
    <div id="live"><i></i>LIVE</div>
    <div id="titles">
      <div id="title">Stream Title Here</div>
      <div id="game-name">Game Name</div>
    </div>
    <div id="eq"></div>
  </div>

<script>
var q = {};
location.search.substring(1).split('&').forEach(function (p) {
  if (!p) return;
  var kv = p.split('=');
  q[decodeURIComponent(kv[0])] = decodeURIComponent((kv[1] || '').replace(/\+/g, ' '));
});
if (q.hue) document.documentElement.style.setProperty('--h', q.hue);
if (q.title) document.getElementById('title').textContent = q.title;
if (q.game)  document.getElementById('game-name').textContent = q.game;
if (q.bg === '0') document.getElementById('bg').style.display = 'none';
var neonEnabled = !(q.neon === '0' || q.neon === 'off');
document.body.classList.toggle('no-neon', !neonEnabled);

if (q.status && q.status !== '0' && q.status !== 'off') {
  var st = document.getElementById('status');
  st.textContent = q.status;
  st.style.display = 'flex';
}

var camDisabled = (q.cam === '0' || q.cam === 'off');
var clockDisabled = (q.clock === '0' || q.clock === 'off');
var timerMode = q.timer || 'uptime'; // 'uptime', 'countdown', 'none'
var parsedCdMins = parseInt(q.cdmins, 10);
var cdMins = Number.isFinite(parsedCdMins) ? Math.min(180, Math.max(1, parsedCdMins)) : 15;

var clockEl = document.getElementById('clock');
var timerEl = document.getElementById('timerCard');
var camEl = document.getElementById('cam');
var bgPath = document.getElementById('bg-path');

// Configure Timer Label
if (timerMode === 'countdown') {
  document.getElementById('timerLabel').textContent = 'Countdown';
} else if (timerMode === 'none') {
  timerEl.style.display = 'none';
}
if (clockDisabled) {
  clockEl.style.display = 'none';
}

// Layout & Positioning logic based on active modules
if (camDisabled) {
  camEl.style.display = 'none';
  
  // FIX: Expand game width to match the wide background cutout
  document.getElementById('game').style.width = '1872px';
  
  // Game window fills full width above the bottom strip
  bgPath.setAttribute('d', `
    M0 0 H1920 V1080 H0 Z
    M46 24 H1874 A22 30 0 0 1 1896 46 V866 A22 22 0 0 1 1874 888 H46 A22 30 0 0 1 24 866 V46 A22 30 0 0 1 46 24 Z
  `);

  // Handle right-hand side stacking when cam is off
  if (!clockDisabled && timerMode !== 'none') {
    // Both active: share the column vertically
    clockEl.style.top = '30px';
    clockEl.style.height = '420px';
    timerEl.style.top = '468px';
    timerEl.style.height = '420px';
  } else if (!clockDisabled && timerMode === 'none') {
    // Only clock active: keep it down in the lower section without stretching to the top
    clockEl.style.top = '360px';
    clockEl.style.height = '528px';
  } else if (clockDisabled && timerMode !== 'none') {
    // Only timer active: keep it down in the lower section
    timerEl.style.top = '360px';
    timerEl.style.height = '528px';
  }
} else {
  // Cam is active
  if (!clockDisabled && timerMode === 'none') {
    // Cam + Clock (Timer disabled) -> Clock moves up to fill space
    clockEl.style.top = '360px';
    clockEl.style.height = '360px';
  } 
}

// Equalizer bars
var eq = document.getElementById('eq');
for (var i = 0; i < 22; i++) {
  var b = document.createElement('b');
  b.style.animationDuration = (0.5 + Math.random() * 0.9).toFixed(2) + 's';
  b.style.animationDelay = (-Math.random()).toFixed(2) + 's';
  eq.appendChild(b);
}

// Timer initializations. The countdown stores its duration alongside its start
// time so a stale timestamp from an older countdown cannot make a new one open at 00:00:00.
var start;
try {
  var storedStart = Number(localStorage.getItem('streamStart'));
  if (q.reset === '1' || !Number.isFinite(storedStart) || storedStart <= 0) {
    storedStart = Date.now();
    localStorage.setItem('streamStart', storedStart);
  }
  start = storedStart;
} catch (e) { start = Date.now(); }

var cdStart;
try {
  var countdownDuration = cdMins * 60;
  var storedCdStart = Number(localStorage.getItem('cdStart'));
  var storedCdDuration = Number(localStorage.getItem('cdDurationSecs'));
  if (q.reset === '1' || !Number.isFinite(storedCdStart) || storedCdStart <= 0 || storedCdDuration !== countdownDuration) {
    storedCdStart = Date.now();
    localStorage.setItem('cdStart', storedCdStart);
    localStorage.setItem('cdDurationSecs', countdownDuration);
  }
  cdStart = storedCdStart;
} catch (e) { cdStart = Date.now(); }

window.addEventListener('storage', function (event) {
  var timestamp = Number(event.newValue);
  if (event.key === 'streamStart' && Number.isFinite(timestamp) && timestamp > 0) start = timestamp;
  if (event.key === 'cdStart' && Number.isFinite(timestamp) && timestamp > 0) cdStart = timestamp;
  if (event.key === 'cdDurationSecs' && Number.isFinite(timestamp) && timestamp >= 60) {
    cdMins = Math.min(180, Math.max(1, Math.floor(timestamp / 60)));
  }
});

var DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
var MONTHS = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
var pad = function (n) { return String(n).padStart(2, '0'); };
var C = 2 * Math.PI * 78;

function frame() {
  var d = new Date();
  if (!clockDisabled) {
    document.getElementById('day').textContent = DAYS[d.getDay()];
    document.getElementById('time').innerHTML = pad(d.getHours()) + '<span class="colon">:</span>' + pad(d.getMinutes());
    document.getElementById('date').textContent = pad(d.getDate()) + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear();
    var secs = d.getSeconds() + d.getMilliseconds() / 1000;
    document.getElementById('fill').style.width = (secs / 60 * 100) + '%';
  }

  if (timerMode !== 'none') {
    if (timerMode === 'uptime') {
      var t = Math.max(0, Math.floor((Date.now() - start) / 1000));
      document.getElementById('timerTxt').textContent = pad(Math.floor(t / 3600)) + ':' + pad(Math.floor(t / 60) % 60) + ':' + pad(t % 60);
      document.getElementById('ring').setAttribute('stroke-dashoffset', C * (1 - (t % 60) / 60));
    } else if (timerMode === 'countdown') {
      var totalSecs = cdMins * 60;
      var elapsed = Math.floor((Date.now() - cdStart) / 1000);
      var remaining = Math.max(0, totalSecs - elapsed);
      var hrs = Math.floor(remaining / 3600);
      var mins = Math.floor((remaining % 3600) / 60);
      var secs = remaining % 60;
      document.getElementById('timerTxt').textContent = pad(hrs) + ':' + pad(mins) + ':' + pad(secs);
      document.getElementById('ring').setAttribute('stroke-dashoffset', C * (1 - (remaining % 60) / 60));
    }
  }

  requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
