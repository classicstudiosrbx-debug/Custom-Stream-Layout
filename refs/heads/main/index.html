<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Layout Studio & Viewer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                        orbitron: ['Orbitron', 'monospace'],
                        rajdhani: ['Rajdhani', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        @property --a { syntax: '<angle>'; inherits: false; initial-value: 0deg; }

        :root {
            --h: 280;
            --c1: hsl(var(--h) 100% 62%);
            --c2: hsl(calc(var(--h) + 70) 100% 60%);
            --c3: hsl(calc(var(--h) + 140) 100% 62%);
            --card: rgba(10, 8, 22, .86);
        }

        body { font-family: 'Outfit', sans-serif; }

        .frame {
            position: absolute; border-radius: 20px; overflow: hidden; z-index: 1;
            box-shadow: 0 0 30px color-mix(in srgb, var(--c1) 50%, transparent),
                        0 0 60px color-mix(in srgb, var(--c2) 28%, transparent);
        }
        .frame::before {
            content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 4px;
            background: conic-gradient(from var(--a), var(--c1), var(--c2), var(--c3), var(--c1));
            animation: spin 7s linear infinite;
            -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            -webkit-mask-composite: xor;
                    mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
                    mask-composite: exclude;
        }
        @keyframes spin { to { --a: 360deg; } }

        .card-custom {
            position: absolute; border-radius: 22px; overflow: hidden;
            background:
                radial-gradient(120% 140% at 0% 0%, color-mix(in srgb, var(--c1) 22%, transparent), transparent 55%),
                radial-gradient(120% 140% at 100% 100%, color-mix(in srgb, var(--c3) 20%, transparent), transparent 55%),
                var(--card);
            box-shadow: 0 0 0 2px color-mix(in srgb, var(--c2) 45%, transparent),
                        0 0 30px color-mix(in srgb, var(--c1) 30%, transparent);
        }
        .card-custom::after {
            content: ""; position: absolute; top: 0; bottom: 0; width: 70px; left: -120px;
            background: linear-gradient(100deg, transparent, rgba(255,255,255,.12), transparent);
            transform: skewX(-18deg); animation: sweep 6s ease-in-out infinite;
        }
        @keyframes sweep { 0%, 60% { left: -120px; } 100% { left: 115%; } }

        .label-custom {
            font: 700 16px/1 'Rajdhani', sans-serif; letter-spacing: .45em; text-transform: uppercase;
            color: var(--c2); text-shadow: 0 0 20px var(--c2); padding-left: .45em;
        }
        .glow-custom {
            font-family: 'Orbitron', monospace; font-weight: 900; color: #fff; font-variant-numeric: tabular-nums;
            text-shadow: 0 0 6px #fff, 0 0 18px var(--c1), 0 0 38px var(--c1), 0 0 64px var(--c2);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen selection:bg-purple-500 selection:text-white">

    <div id="app" class="min-h-screen flex flex-col"></div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        
        let state = {
            gameTitle: urlParams.get('title') || "ROBLOX // BUILDING A BOAT",
            gameSubtitle: urlParams.get('game') || "ROBLOX",
            hue: parseInt(urlParams.get('hue')) || 280,
            statusText: urlParams.get('status') || "",
            showFacecam: urlParams.get('cam') !== '0' && urlParams.get('cam') !== 'off',
            showClock: urlParams.get('clock') !== '0' && urlParams.get('clock') !== 'off',
            timerMode: urlParams.get('timer') || 'uptime',
            cdMins: parseInt(urlParams.get('cdmins')) || 15,
            isViewMode: urlParams.get('view') === '1' || urlParams.get('obs') === '1'
        };

        if (!state.isViewMode) {
            try {
                const saved = localStorage.getItem('stream_layout_state_v3');
                if (saved) {
                    state = { ...state, ...JSON.parse(saved) };
                }
            } catch (e) {}
        }

        function saveState() {
            try {
                localStorage.setItem('stream_layout_state_v3', JSON.stringify(state));
            } catch(e) {}
        }

        document.documentElement.style.setProperty('--h', state.hue);

        let streamStart = Date.now();
        let cdStart = Date.now();
        try {
            if (!localStorage.getItem('streamStart')) localStorage.setItem('streamStart', Date.now());
            streamStart = +localStorage.getItem('streamStart');
            if (!localStorage.getItem('cdStart')) localStorage.setItem('cdStart', Date.now());
            cdStart = +localStorage.getItem('cdStart');
        } catch(e) {}

        let tickerInterval = null;

        function getObsUrl() {
            const baseUrl = window.location.href.split('?')[0];
            const params = new URLSearchParams();
            
            params.set('view', '1');
            params.set('hue', state.hue);
            params.set('title', state.gameTitle);
            params.set('game', state.gameSubtitle);
            if (state.statusText) params.set('status', state.statusText);
            params.set('cam', state.showFacecam ? '1' : '0');
            params.set('clock', state.showClock ? '1' : '0');
            params.set('timer', state.timerMode);
            params.set('cdmins', state.cdMins);

            return baseUrl + '?' + params.toString();
        }

        function render() {
            const app = document.getElementById('app');
            
            if (state.isViewMode) {
                app.innerHTML = renderLayoutHTML(true);
                initLiveTickers();
            } else {
                const gameW = state.showFacecam ? 1536 : 1872;
                const camW = 312;
                const camH = 312;

                app.innerHTML = `
                    <header class="bg-slate-900 border-b border-slate-800 px-6 py-4 flex items-center justify-between sticky top-0 z-50">
                        <div class="flex items-center space-x-3">
                            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-purple-600 to-pink-500 flex items-center justify-center shadow-lg shadow-purple-500/30">
                                <i class="fa-solid fa-sliders text-white text-lg"></i>
                            </div>
                            <div>
                                <h1 class="font-bold text-lg tracking-tight text-white">Stream Layout Studio</h1>
                                <p class="text-xs text-slate-400">Configure your professional OBS overlay layout in real-time</p>
                            </div>
                        </div>
                        <div class="flex items-center space-x-3">
                            <button onclick="openOBSView()" class="px-4 py-2 bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 text-white font-medium text-sm rounded-xl shadow-lg shadow-purple-600/25 transition-all flex items-center space-x-2">
                                <i class="fa-solid fa-arrow-up-right-from-square"></i>
                                <span>Preview Overlay Window</span>
                            </button>
                        </div>
                    </header>

                    <main class="flex-1 flex flex-col lg:flex-row overflow-hidden">
                        <!-- Controls Sidebar -->
                        <aside class="w-full lg:w-[420px] bg-slate-900/80 backdrop-blur-md border-r border-slate-800 p-6 overflow-y-auto space-y-6 shrink-0">
                            
                            <!-- OBS URL Box & Copy -->
                            <div class="bg-slate-950 border border-purple-500/30 rounded-2xl p-4 shadow-xl shadow-purple-950/20">
                                <h2 class="text-xs font-bold uppercase tracking-wider text-purple-400 mb-2 flex items-center justify-between">
                                    <span class="flex items-center space-x-2"><i class="fa-solid fa-link"></i><span>OBS Browser Source URL</span></span>
                                    <button onclick="copyObsUrl()" class="text-xs bg-purple-600 hover:bg-purple-500 text-white px-2.5 py-1 rounded-lg transition-colors flex items-center space-x-1.5 font-medium">
                                        <i class="fa-solid fa-copy"></i><span id="copy-btn-text">Copy URL</span>
                                    </button>
                                </h2>
                                <input type="text" id="obs-url-input" readonly value="${getObsUrl()}" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-xs font-mono text-slate-300 select-all focus:outline-none">
                                <p class="text-[11px] text-slate-400 mt-2">Copy and paste this URL directly into your OBS Browser Source settings (1920x1080).</p>
                            </div>

                            <!-- OBS Source Transforms (Pixels) -->
                            <div class="bg-slate-950 border border-slate-800 rounded-2xl p-4 space-y-3">
                                <h2 class="text-xs font-bold uppercase tracking-wider text-purple-400 flex items-center space-x-2">
                                    <i class="fa-solid fa-ruler-combined"></i><span>OBS Source Transforms (Pixels)</span>
                                </h2>
                                <p class="text-[11px] text-slate-400">Use these exact pixel dimensions inside OBS when placing your game capture and facecam sources behind the overlay:</p>
                                <div class="space-y-2 text-xs font-mono">
                                    <div class="bg-slate-900 p-2 rounded-lg border border-slate-800 flex justify-between items-center">
                                        <span class="text-slate-300"><i class="fa-solid fa-gamepad text-purple-400 mr-1.5"></i> Game / Display Capture</span>
                                        <span class="text-purple-300">X: 22px | Y: 22px<br>W: ${gameW}px | H: 864px</span>
                                    </div>
                                    ${state.showFacecam ? `
                                    <div class="bg-slate-900 p-2 rounded-lg border border-slate-800 flex justify-between items-center">
                                        <span class="text-slate-300"><i class="fa-solid fa-video text-pink-400 mr-1.5"></i> Facecam Source</span>
                                        <span class="text-pink-300">X: 1584px | Y: 30px<br>W: ${camW}px \vert{} H:${camH}px</span>
                                    </div>
                                    ` : `
                                    <div class="bg-slate-900 p-2 rounded-lg border border-slate-800 text-slate-500 italic text-center">
                                        Facecam frame is currently disabled.
                                    </div>
                                    `}
                                </div>
                            </div>

                            <!-- Stream Info -->
                            <div>
                                <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-4 flex items-center space-x-2">
                                    <i class="fa-solid fa-display text-purple-400"></i>
                                    <span>Stream Info</span>
                                </h2>
                                <div class="space-y-4">
                                    <div>
                                        <label class="block text-xs font-medium text-slate-300 mb-1">Game Title / Header</label>
                                        <input type="text" value="${escapeHtml(state.gameTitle)}" onchange="updateState('gameTitle', this.value)" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-purple-500">
                                    </div>
                                    <div>
                                        <label class="block text-xs font-medium text-slate-300 mb-1">Game Name / Subtitle</label>
                                        <input type="text" value="${escapeHtml(state.gameSubtitle)}" onchange="updateState('gameSubtitle', this.value)" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-purple-500">
                                    </div>
                                    <div>
                                        <label class="block text-xs font-medium text-slate-300 mb-1">Status Banner Text (leave empty to hide)</label>
                                        <input type="text" value="${escapeHtml(state.statusText)}" onchange="updateState('statusText', this.value)" placeholder="e.g. BRB / STARTING SOON" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-purple-500">
                                    </div>
                                </div>
                            </div>

                            <hr class="border-slate-800">

                            <!-- Theme & Hue -->
                            <div>
                                <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-4 flex items-center space-x-2">
                                    <i class="fa-solid fa-palette text-purple-400"></i>
                                    <span>Theme & Color Hue</span>
                                </h2>
                                <div>
                                    <div class="flex justify-between text-xs text-slate-400 mb-1">
                                        <span>Hue Angle</span>
                                        <span class="font-mono text-white" id="hue-val-label">${state.hue}°</span>
                                    </div>
                                    <input type="range" min="0" max="360" value="${state.hue}" oninput="updateHueLive(this.value)" onchange="updateHueFinal(this.value)" class="w-full accent-purple-500 bg-slate-950 cursor-pointer">
                                </div>
                            </div>

                            <hr class="border-slate-800">

                            <!-- Layout Modules -->
                            <div>
                                <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-4 flex items-center space-x-2">
                                    <i class="fa-solid fa-layer-group text-purple-400"></i>
                                    <span>Layout Modules</span>
                                </h2>
                                <div class="space-y-3">
                                    <label class="flex items-center justify-between p-3 bg-slate-950 border border-slate-800/80 rounded-xl cursor-pointer hover:border-slate-700 transition-all">
                                        <span class="text-sm font-medium text-slate-200 flex items-center space-x-2">
                                            <i class="fa-solid fa-video text-pink-400 w-5"></i>
                                            <span>Facecam Frame</span>
                                        </span>
                                        <input type="checkbox" ${state.showFacecam ? 'checked' : ''} onchange="toggleModule('showFacecam', this.checked)" class="w-4 h-4 rounded text-purple-600 focus:ring-purple-500 bg-slate-900 border-slate-700">
                                    </label>

                                    <label class="flex items-center justify-between p-3 bg-slate-950 border border-slate-800/80 rounded-xl cursor-pointer hover:border-slate-700 transition-all">
                                        <span class="text-sm font-medium text-slate-200 flex items-center space-x-2">
                                            <i class="fa-solid fa-clock text-blue-400 w-5"></i>
                                            <span>Clock Card</span>
                                        </span>
                                        <input type="checkbox" ${state.showClock ? 'checked' : ''} onchange="toggleModule('showClock', this.checked)" class="w-4 h-4 rounded text-purple-600 focus:ring-purple-500 bg-slate-900 border-slate-700">
                                    </label>
                                </div>
                            </div>

                            <hr class="border-slate-800">

                            <!-- Timer Settings -->
                            <div>
                                <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-4 flex items-center space-x-2">
                                    <i class="fa-solid fa-stopwatch text-purple-400"></i>
                                    <span>Timer / Uptime Settings</span>
                                </h2>
                                <div class="space-y-4">
                                    <div>
                                        <label class="block text-xs font-medium text-slate-300 mb-1">Timer Mode</label>
                                        <select onchange="updateState('timerMode', this.value)" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-purple-500">
                                            <option value="uptime" ${state.timerMode === 'uptime' ? 'selected' : ''}>Uptime (Count Up)</option>
                                            <option value="countdown" ${state.timerMode === 'countdown' ? 'selected' : ''}>Countdown Timer</option>
                                            <option value="none" ${state.timerMode === 'none' ? 'selected' : ''}>Disabled / None</option>
                                        </select>
                                    </div>
                                    ${state.timerMode === 'countdown' ? `
                                    <div>
                                        <label class="block text-xs font-medium text-slate-300 mb-1">Countdown Duration (Minutes)</label>
                                        <div class="flex items-center space-x-2">
                                            <input type="number" min="1" max="180" value="${state.cdMins}" onchange="updateCdMins(this.value)" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none">
                                            <button onclick="resetTimers()" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs rounded-xl font-medium">Reset</button>
                                        </div>
                                    </div>
                                    ` : ''}
                                </div>
                            </div>

                        </aside>

                        <!-- Preview Area -->
                        <div id="preview-wrapper" class="flex-1 bg-slate-900 p-6 flex flex-col items-center justify-center overflow-hidden relative">
                            <div class="absolute top-4 left-6 text-xs text-slate-400 flex items-center space-x-2 z-10">
                                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                                <span>Live Overlay Preview (Scaled 1920x1080)</span>
                            </div>

                            <div id="preview-box" class="bg-black rounded-2xl overflow-hidden shadow-2xl relative border border-slate-800 flex items-center justify-center">
                                <div style="width: 1920px; height: 1080px; position: absolute; top: 0; left: 0; transform-origin: top left;" id="preview-inner">
                                    ${renderLayoutHTML(false)}
                                </div>
                            </div>
                        </div>
                    </main>
                `;
                
                updatePreviewScale();
                window.onresize = updatePreviewScale;
                initLiveTickers();
            }
        }

        function updatePreviewScale() {
            const wrapper = document.getElementById('preview-wrapper');
            const box = document.getElementById('preview-box');
            const inner = document.getElementById('preview-inner');
            
            if (wrapper && box && inner) {
                const maxWidth = wrapper.clientWidth - 48;
                const maxHeight = wrapper.clientHeight - 64;
                const scale = Math.min(maxWidth / 1920, maxHeight / 1080, 1);
                
                inner.style.transform = `scale(${scale})`;
                box.style.width = `${1920 * scale}px`;
                box.style.height = `${1080 * scale}px`;
            }
        }

        function renderLayoutHTML(isPureOverlay) {
            const camDisabled = !state.showFacecam;
            const clockDisabled = !state.showClock;
            const timerMode = state.timerMode;
            
            let svgPathD = `
                M0 0 H1920 V1080 H0 Z
                M46 24 H1538 A22 30 0 0 1 1560 46 V866 A22 22 0 0 1 1538 888 H46 A22 30 0 0 1 24 866 V46 A22 30 0 0 1 46 24 Z
                M1606 24 H1874 A22 30 0 0 1 1896 46 V314 A22 22 0 0 1 1874 336 H1606 A22 30 0 0 1 1584 314 V46 A22 30 0 0 1 1606 24 Z
            `;

            if (camDisabled) {
                svgPathD = `
                    M0 0 H1920 V1080 H0 Z
                    M46 24 H1874 A22 30 0 0 1 1896 46 V866 A22 22 0 0 1 1874 888 H46 A22 30 0 0 1 24 866 V46 A22 30 0 0 1 46 24 Z
                `;
            }

            let clockTop = 360, clockHeight = 252;
            let timerTop = 636, timerHeight = 252;

            if (camDisabled) {
                if (!clockDisabled && timerMode !== 'none') {
                    clockTop = 30; clockHeight = 420;
                    timerTop = 468; timerHeight = 420;
                } else if (!clockDisabled && timerMode === 'none') {
                    clockTop = 360; clockHeight = 528;
                } else if (clockDisabled && timerMode !== 'none') {
                    timerTop = 360; timerHeight = 528;
                }
            } else {
                if (!clockDisabled && timerMode === 'none') {
                    clockTop = 360; clockHeight = 528;
                } else if (clockDisabled && timerMode !== 'none') {
                    timerTop = 360; timerHeight = 528;
                }
            }

            const gameWidth = camDisabled ? '1872px' : '1536px';

            return `
                <svg id="bg" width="1920" height="1080" viewBox="0 0 1920 1080" style="position:absolute;left:0;top:0;z-index:0;pointer-events:none;">
                    <path id="bg-path" fill="#000" fill-rule="evenodd" d="${svgPathD}"/>
                </svg>

                <div class="frame" id="game" style="left: 22px; top: 22px; width: ${gameWidth}; height: 864px; transition: width 0.3s ease;">
                    <div class="absolute w-[34px] h-[34px] border-[3px] border-white z-10 top-[14px] left-[14px] border-r-0 border-bottom-0 rounded-tl-[10px]" style="filter: drop-shadow(0 0 6px var(--c2))"></div>
                    <div class="absolute w-[34px] h-[34px] border-[3px] border-white z-10 top-[14px] right-[14px] border-l-0 border-bottom-0 rounded-tr-[10px]" style="filter: drop-shadow(0 0 6px var(--c2))"></div>
                    <div class="absolute w-[34px] h-[34px] border-[3px] border-white z-10 bottom-[14px] left-[14px] border-r-0 border-top-0 rounded-bl-[10px]" style="filter: drop-shadow(0 0 6px var(--c2))"></div>
                    <div class="absolute w-[34px] h-[34px] border-[3px] border-white z-10 bottom-[14px] right-[14px] border-l-0 border-top-0 rounded-br-[10px]" style="filter: drop-shadow(0 0 6px var(--c2))"></div>
                </div>

                <div class="frame" id="cam" style="left: 1584px; top: 30px; width: 312px; height: 312px; display: ${camDisabled ? 'none' : 'block'};"></div>

                <div id="status" style="display: ${state.statusText ? 'flex' : 'none'}; position: absolute; left: 792px; top: 2px; transform: translateX(-50%); z-index: 10; align-items: center; gap: 14px; padding: 12px 34px; border-radius: 40px; background: linear-gradient(135deg, color-mix(in srgb, var(--c1) 30%, transparent), color-mix(in srgb, var(--c3) 25%, transparent)), var(--card); box-shadow: 0 0 0 2px var(--c2), 0 0 26px color-mix(in srgb, var(--c1) 60%, transparent); font: 700 28px/1 'Orbitron', monospace; letter-spacing: .22em; text-transform: uppercase; color: #fff; text-shadow: 0 0 10px var(--c1), 0 0 24px var(--c2); white-space: nowrap; padding-left: calc(34px + .22em);">
                    ${escapeHtml(state.statusText)}
                </div>

                <div class="card-custom" id="clock" style="left: 1584px; top: ${clockTop}px; width: 312px; height: ${clockHeight}px; display: ${clockDisabled ? 'none' : 'flex'}; flex-direction: column; align-items: center; justify-content: center; gap: 10px;">
                    <div class="label-custom" id="day">MONDAY</div>
                    <div class="glow-custom" id="time" style="font-size: 56px; line-height: 1;">00<span class="colon" style="color: var(--c2);">:</span>00</div>
                    <div id="date" style="font: 600 20px/1 'Rajdhani', sans-serif; letter-spacing: .26em; color: rgba(255,255,255,.8); padding-left: .26em;">01 JAN 2026</div>
                    <div id="bar" style="width: 240px; height: 6px; border-radius: 6px; background: rgba(255,255,255,.1); overflow: hidden; margin-top: 4px;">
                        <div id="fill" style="height: 100%; width: 0%; border-radius: 6px; background: linear-gradient(90deg, var(--c1), var(--c2), var(--c3)); box-shadow: 0 0 12px var(--c2);"></div>
                    </div>
                </div>

                <div class="card-custom" id="timerCard" style="left: 1584px; top: ${timerTop}px; width: 312px; height: ${timerHeight}px; display: ${timerMode === 'none' ? 'none' : 'flex'}; flex-direction: column; align-items: center; justify-content: center; gap: 10px;">
                    <div class="label-custom" id="timerLabel">${timerMode === 'countdown' ? 'Countdown' : 'Time Live'}</div>
                    <div style="position: relative; width: 176px; height: 176px;">
                        <svg width="176" height="176" viewBox="0 0 176 176" style="position: absolute; inset: 0; transform: rotate(-90deg);">
                            <circle cx="88" cy="88" r="78" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="8"/>
                            <circle id="ring" cx="88" cy="88" r="78" fill="none" stroke="url(#g)" stroke-width="8" stroke-linecap="round" stroke-dasharray="490.1" stroke-dashoffset="490.1" style="filter: drop-shadow(0 0 6px var(--c2));"/>
                            <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
                                <stop offset="0" stop-color="hsl(var(--h) 100% 62%)"/><stop offset="1" stop-color="hsl(calc(var(--h) + 140) 100% 62%)"/>
                            </linearGradient></defs>
                        </svg>
                        <div class="glow-custom" id="timerTxt" style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 25px;">00:00:00</div>
                    </div>
                </div>

                <div class="card-custom" id="strip" style="left: 30px; top: 912px; width: 1872px; height: 144px; display: flex; align-items: center; padding: 0 40px; gap: 32px;">
                    <div style="display: flex; align-items: center; gap: 12px; padding: 12px 22px; border-radius: 40px; background: color-mix(in srgb, var(--c1) 22%, transparent); border: 2px solid var(--c1); font: 700 22px/1 'Rajdhani', sans-serif; letter-spacing: .3em; color: #fff;">
                        <i style="width: 14px; height: 14px; border-radius: 50%; background: #ff3b5c; box-shadow: 0 0 14px #ff3b5c; animation: pulse 1.4s ease-in-out infinite; display: inline-block;"></i>LIVE
                    </div>
                    <div style="flex: 1; min-width: 0;">
                        <div id="title" style="font: 900 52px/1.1 'Orbitron', monospace; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 0 12px var(--c1), 0 0 34px var(--c1);">${escapeHtml(state.gameTitle)}</div>
                        <div id="game-name" style="margin-top: 10px; font: 700 26px/1 'Rajdhani', sans-serif; letter-spacing: .4em; text-transform: uppercase; color: var(--c3); text-shadow: 0 0 10px var(--c3);">${escapeHtml(state.gameSubtitle)}</div>
                    </div>
                    <div id="eq" style="display: flex; align-items: flex-end; gap: 6px; height: 80px;">
                        ${Array.from({length: 22}).map(() => `<b style="width: 10px; border-radius: 5px; background: linear-gradient(to top, var(--c1), var(--c2), var(--c3)); box-shadow: 0 0 10px color-mix(in srgb, var(--c2) 70%, transparent); height: 20%; animation: eq 1s ease-in-out infinite alternate; animation-duration: ${(0.5 + Math.random() * 0.9).toFixed(2)}s; animation-delay:${(-Math.random()).toFixed(2)}s;"></b>`).join('')}
                    </div>
                </div>
            `;
        }

        function updateState(key, val) {
            state[key] = val;
            saveState();
            render();
        }

        function updateHueLive(val) {
            state.hue = parseInt(val);
            document.documentElement.style.setProperty('--h', state.hue);
            const label = document.getElementById('hue-val-label');
            if (label) label.textContent = state.hue + '°';
            const urlInput = document.getElementById('obs-url-input');
            if (urlInput) urlInput.value = getObsUrl();
        }

        function updateHueFinal(val) {
            state.hue = parseInt(val);
            saveState();
            render();
        }

        function toggleModule(key, val) {
            state[key] = val;
            saveState();
            render();
        }

        function updateCdMins(mins) {
            state.cdMins = parseInt(mins) || 15;
            saveState();
            render();
        }

        function resetTimers() {
            try {
                localStorage.setItem('streamStart', Date.now());
                localStorage.setItem('cdStart', Date.now());
                streamStart = Date.now();
                cdStart = Date.now();
            } catch(e) {}
        }

        function copyObsUrl() {
            const urlInput = document.getElementById('obs-url-input');
            if (urlInput) {
                urlInput.select();
                navigator.clipboard.writeText(urlInput.value).then(() => {
                    const btnText = document.getElementById('copy-btn-text');
                    if (btnText) {
                        btnText.textContent = 'Copied!';
                        setTimeout(() => { btnText.textContent = 'Copy URL'; }, 2000);
                    }
                }).catch(() => {
                    document.execCommand('copy');
                    const btnText = document.getElementById('copy-btn-text');
                    if (btnText) {
                        btnText.textContent = 'Copied!';
                        setTimeout(() => { btnText.textContent = 'Copy URL'; }, 2000);
                    }
                });
            }
        }

        function openOBSView() {
            window.open(getObsUrl(), '_blank', 'width=1280,height=720');
        }

        function escapeHtml(str) {
            return (str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
        const MONTHS = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
        const pad = (n) => String(n).padStart(2, '0');
        const C = 2 * Math.PI * 78;

        function initLiveTickers() {
            if (tickerInterval) clearInterval(tickerInterval);

            tickerInterval = setInterval(() => {
                const d = new Date();
                
                const dayEl = document.getElementById('day');
                if (dayEl) dayEl.textContent = DAYS[d.getDay()];
                
                const timeEl = document.getElementById('time');
                if (timeEl) timeEl.innerHTML = pad(d.getHours()) + '<span class="colon" style="color: var(--c2);">:</span>' + pad(d.getMinutes());
                
                const dateEl = document.getElementById('date');
                if (dateEl) dateEl.textContent = pad(d.getDate()) + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear();
                
                const fillEl = document.getElementById('fill');
                if (fillEl) {
                    const secs = d.getSeconds() + d.getMilliseconds() / 1000;
                    fillEl.style.width = (secs / 60 * 100) + '%';
                }

                const timerTxt = document.getElementById('timerTxt');
                const ringEl = document.getElementById('ring');
                if (timerTxt && ringEl) {
                    if (state.timerMode === 'uptime') {
                        const t = Math.max(0, Math.floor((Date.now() - streamStart) / 1000));
                        timerTxt.textContent = pad(Math.floor(t / 3600)) + ':' + pad(Math.floor(t / 60) % 60) + ':' + pad(t % 60);
                        ringEl.setAttribute('stroke-dashoffset', C * (1 - (t % 60) / 60));
                    } else if (state.timerMode === 'countdown') {
                        const totalSecs = state.cdMins * 60;
                        const elapsed = Math.floor((Date.now() - cdStart) / 1000);
                        const remaining = Math.max(0, totalSecs - elapsed);
                        const hrs = Math.floor(remaining / 3600);
                        const mins = Math.floor((remaining % 3600) / 60);
                        const secs = remaining % 60;
                        timerTxt.textContent = pad(hrs) + ':' + pad(mins) + ':' + pad(secs);
                        ringEl.setAttribute('stroke-dashoffset', C * (1 - (remaining % 60) / 60));
                    }
                }
            }, 250);
        }

        render();
    </script>
</body>
</html>
