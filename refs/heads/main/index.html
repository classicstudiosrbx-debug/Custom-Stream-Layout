<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Stream Layout Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cf: {
                            orange: '#F38020',
                            darkorange: '#C85C00',
                            bg: '#07090e',
                            panel: '#0d111a',
                            border: '#1e2638',
                            cyan: '#00f0ff',
                            pink: '#ff0055',
                            purple: '#8a2be2',
                            green: '#00ff66'
                        }
                    },
                    fontFamily: {
                        orbitron: ['Orbitron', 'sans-serif'],
                        rajdhani: ['Rajdhani', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace']
                    }
                }
            }
        }
    </script>

    <style>
        :root {
            --h: 280;
            --c1: hsl(var(--h) 100% 62%);
            --c2: hsl(calc(var(--h) + 70) 100% 60%);
            --c3: hsl(calc(var(--h) + 140) 100% 62%);
            --card: rgba(10, 8, 22, .86);
        }

        body {
            background-color: #07090e;
            color: #e2e8f0;
            font-family: 'Rajdhani', sans-serif;
        }

        .cf-glass {
            background: rgba(13, 17, 26, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(243, 128, 32, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.6);
        }

        input[type=range] {
            -webkit-appearance: none;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 18px;
            width: 18px;
            border-radius: 4px;
            background: var(--c1);
            cursor: pointer;
            box-shadow: 0 0 12px var(--c1);
            margin-top: -6px;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 6px;
            cursor: pointer;
            background: #1e2638;
            border-radius: 3px;
        }

        /* Scaled Preview Elements matching Stream-layout.html */
        .preview-canvas {
            aspect-ratio: 16 / 9;
            background: #020205;
            position: relative;
            overflow: hidden;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .prev-frame {
            position: absolute;
            border-radius: 12px;
            border: 2px solid var(--c1);
            box-shadow: 0 0 15px color-mix(in srgb, var(--c1) 40%, transparent);
        }
        .prev-card {
            position: absolute;
            border-radius: 10px;
            background: var(--card);
            border: 1px solid color-mix(in srgb, var(--c2) 40%, transparent);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Header -->
    <header class="border-b border-cf-border bg-cf-panel/90 backdrop-blur-md px-6 py-3.5 sticky top-0 z-50 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <div class="flex items-center justify-center w-10 h-10 rounded-xl bg-cf-orange/10 border border-cf-orange text-cf-orange">
                <i class="fa-solid fa-layer-group text-lg"></i>
            </div>
            <h1 class="font-orbitron font-bold text-sm tracking-wider text-white">CUSTOM STREAM LAYOUT <span class="text-cf-orange text-xs px-2 py-0.5 rounded bg-cf-orange/20">GENERATOR</span></h1>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="flex-1 p-4 md:p-6 max-w-[1920px] mx-auto w-full grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <!-- Controls Column -->
        <div class="lg:col-span-4 xl:col-span-3 space-y-5">
            <div class="cf-glass rounded-2xl p-5 space-y-4">
                <h2 class="font-orbitron text-xs font-bold tracking-wider text-cf-orange flex items-center gap-2 border-b border-slate-800 pb-3">
                    <i class="fa-solid fa-sliders"></i> OVERLAY PARAMETERS
                </h2>

                <div class="space-y-1">
                    <label class="text-xs font-bold text-slate-300">Stream Title</label>
                    <input type="text" id="inputTitle" value="ROBLOX // PLAYING ANYTHING" oninput="updateLayout()" class="w-full bg-slate-950 border border-slate-800 focus:border-cf-orange rounded-xl px-3.5 py-2 text-xs text-white font-rajdhani focus:outline-none">
                </div>

                <div class="space-y-1">
                    <label class="text-xs font-bold text-slate-300">Game Name</label>
                    <input type="text" id="inputGame" value="ROBLOX" oninput="updateLayout()" class="w-full bg-slate-950 border border-slate-800 focus:border-cf-orange rounded-xl px-3.5 py-2 text-xs text-white font-rajdhani focus:outline-none">
                </div>

                <div class="space-y-1">
                    <label class="text-xs font-bold text-slate-300">Status Badge (?status=)</label>
                    <input type="text" id="inputStatus" value="" placeholder="e.g. BRB or leave blank" oninput="updateLayout()" class="w-full bg-slate-950 border border-slate-800 focus:border-cf-orange rounded-xl px-3.5 py-2 text-xs text-white font-rajdhani focus:outline-none">
                </div>

                <div class="space-y-2 pt-2 border-t border-slate-800">
                    <div class="flex justify-between items-center">
                        <label class="text-xs font-bold text-slate-300">Hue Theme (?hue=)</label>
                        <span id="hueDegDisplay" class="font-mono text-xs text-cf-orange">280°</span>
                    </div>
                    <input type="range" id="inputHue" min="0" max="360" value="280" oninput="updateLayout()" class="w-full">
                </div>
            </div>

            <!-- Output URL Box -->
            <div class="cf-glass rounded-2xl p-5 space-y-3">
                <span class="font-orbitron text-xs font-bold text-cf-orange flex items-center gap-2">
                    <i class="fa-solid fa-link"></i> OBS BROWSER SOURCE URL
                </span>
                <textarea id="outputUrl" readonly rows="3" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-[11px] font-mono text-cyan-400 focus:outline-none resize-none select-all break-all"></textarea>
                <button onclick="copyLayoutUrl()" class="w-full py-2.5 bg-gradient-to-r from-orange-500 to-amber-600 text-white font-bold font-orbitron rounded-xl text-xs transition shadow-lg">
                    <i class="fa-solid fa-copy mr-1"></i> COPY OVERLAY URL
                </button>
            </div>
        </div>

        <!-- Live Preview Canvas Column -->
        <div class="lg:col-span-8 xl:col-span-9 flex flex-col">
            <div class="cf-glass rounded-2xl p-5 space-y-4 flex-1 flex flex-col">
                <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                    <span class="font-orbitron text-xs font-bold text-white flex items-center gap-2">
                        <i class="fa-solid fa-display text-cf-orange"></i> LIVE LAYOUT PREVIEW (1920x1080 scaled)
                    </span>
                </div>

                <!-- Scaled Visual Preview Container -->
                <div class="preview-canvas flex-1" id="previewCanvas">
                    <!-- Game Frame Placeholder -->
                    <div class="prev-frame" style="left: 2%; top: 2%; width: 79%; height: 80%;">
                        <div class="absolute inset-2 border border-dashed border-white/10 flex items-center justify-center text-xs font-mono text-slate-600">GAME FRAME (1536x864)</div>
                    </div>
                    
                    <!-- Webcam Frame Placeholder -->
                    <div class="prev-frame" style="right: 2%; top: 3%; width: 16%; height: 30%;">
                        <div class="absolute inset-2 border border-dashed border-white/10 flex items-center justify-center text-[10px] font-mono text-slate-600">CAM</div>
                    </div>

                    <!-- Clock Card Placeholder -->
                    <div class="prev-card flex flex-col items-center justify-center p-2" style="right: 2%; top: 35%; width: 16%; height: 26%;">
                        <div class="text-[9px] font-bold uppercase tracking-widest text-orange-400">SATURDAY</div>
                        <div class="font-orbitron font-black text-lg text-white">12<span class="text-orange-400">:</span>34</div>
                        <div class="text-[8px] text-slate-400">12 OCT 2026</div>
                    </div>

                    <!-- Uptime Card Placeholder -->
                    <div class="prev-card flex flex-col items-center justify-center p-2" style="right: 2%; top: 63%; width: 16%; height: 26%;">
                        <div class="text-[9px] font-bold uppercase tracking-widest text-slate-300">Time Live</div>
                        <div class="font-orbitron font-bold text-xs text-white mt-1">01:42:19</div>
                    </div>

                    <!-- Bottom Title Strip -->
                    <div class="prev-card flex items-center px-4 gap-4" style="left: 2%; bottom: 2%; width: 96%; height: 13%;">
                        <div class="flex items-center gap-2 px-3 py-1 rounded-full bg-orange-500/20 border border-orange-500 text-xs font-bold text-white">
                            <span class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></span>LIVE
                        </div>
                        <div class="min-w-0 flex-1">
                            <div id="prevTitle" class="font-orbitron font-black text-sm text-white truncate">VALORANT // RADIANT RANKED SPREE</div>
                            <div id="prevGame" class="font-rajdhani font-bold text-xs text-amber-400 tracking-wider">VALORANT</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        function updateLayout() {
            const title = document.getElementById('inputTitle').value;
            const game = document.getElementById('inputGame').value;
            const status = document.getElementById('inputStatus').value;
            const hue = document.getElementById('inputHue').value;

            document.documentElement.style.setProperty('--h', hue);
            document.getElementById('hueDegDisplay').textContent = `${hue}°`;
            document.getElementById('prevTitle').textContent = title;
            document.getElementById('prevGame').textContent = game;

            const baseUrl = window.location.origin + window.location.pathname.replace('index.html', '');
            let fullUrl = `${baseUrl.replace(/\/$/, '')}/view?title=${encodeURIComponent(title)}&game=${encodeURIComponent(game)}&hue=${hue}`;
            if (status) fullUrl += `&status=${encodeURIComponent(status)}`;
            
            document.getElementById('outputUrl').value = fullUrl;
        }

        window.addEventListener('DOMContentLoaded', updateLayout);
    </script>
</body>
</html>
