<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Layout Generator & Viewer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Outfit', sans-serif;
        }
        .glow-border {
            position: relative;
        }
        .glow-border::before {
            content: '';
            position: absolute;
            inset: -2px;
            background: linear-gradient(45deg, #a855f7, #ec4899, #3b82f6, #a855f7);
            border-radius: inherit;
            z-index: -1;
            animation: gradientBorder 6s linear infinite;
            background-size: 400% 400%;
        }
        @keyframes gradientBorder {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .corner-bracket {
            position: absolute;
            width: 12px;
            height: 12px;
            border-color: #ec4899;
            z-index: 10;
            pointer-events: none;
        }
        .corner-tl { top: -2px; left: -2px; border-top: 2px solid; border-left: 2px solid; }
        .corner-tr { top: -2px; right: -2px; border-top: 2px solid; border-right: 2px solid; }
        .corner-bl { bottom: -2px; left: -2px; border-bottom: 2px solid; border-left: 2px solid; }
        .corner-br { bottom: -2px; right: -2px; border-bottom: 2px solid; border-right: 2px solid; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen selection:bg-purple-500 selection:text-white">

    <div id="app" class="min-h-screen flex flex-col"></div>

    <script>
        // State Management
        let state = {
            gameTitle: "ROBLOX // BUILDING A BOAT",
            gameSubtitle: "ROBLOX",
            showFacecam: true,
            showClock: true,
            showTimer: true,
            timerMode: "countdown", // countdown, countup
            timerMinutes: 15,
            timerSeconds: 0,
            timerRunning: true,
            accentColor: "purple", // purple, blue, emerald, amber, rose
            isViewMode: false,
            uptimeSeconds: 0,
            countdownRemaining: 15 * 60
        };

        let timerInterval = null;
        let uptimeInterval = null;

        // Load saved settings if any
        try {
            const saved = localStorage.getItem('stream_layout_state_v2');
            if (saved) {
                state = { ...state, ...JSON.parse(saved) };
                state.countdownRemaining = state.timerMinutes * 60 + state.timerSeconds;
            }
        } catch (e) {
            console.error(e);
        }

        // Check if ?view=1 parameter is present
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('view') === '1' || urlParams.get('obs') === '1') {
            state.isViewMode = true;
        }

        function saveState() {
            try {
                localStorage.setItem('stream_layout_state_v2', JSON.stringify(state));
            } catch(e) {}
        }

        // Timer intervals
        function initTimers() {
            if (timerInterval) clearInterval(timerInterval);
            if (uptimeInterval) clearInterval(uptimeInterval);

            timerInterval = setInterval(() => {
                if (state.timerRunning && state.countdownRemaining > 0) {
                    state.countdownRemaining--;
                    render();
                }
            }, 1000);

            uptimeInterval = setInterval(() => {
                state.uptimeSeconds++;
                render();
            }, 1000);
        }

        initTimers();

        // Helper formatting functions
        function formatClock() {
            const now = new Date();
            return now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
        }

        function formatTimer() {
            if (state.timerMode === 'countup') {
                const hrs = Math.floor(state.uptimeSeconds / 3600).toString().padStart(2, '0');
                const mins = Math.floor((state.uptimeSeconds % 3600) / 60).toString().padStart(2, '0');
                const secs = (state.uptimeSeconds % 60).toString().padStart(2, '0');
                return `${hrs}:${mins}:${secs}`;
            } else {
                const total = Math.max(0, state.countdownRemaining);
                const hrs = Math.floor(total / 3600).toString().padStart(2, '0');
                const mins = Math.floor((total % 3600) / 60).toString().padStart(2, '0');
                const secs = (total % 60).toString().padStart(2, '0');
                return `${hrs}:${mins}:${secs}`;
            }
        }

        function render() {
            const app = document.getElementById('app');
            
            if (state.isViewMode) {
                // Pure transparent OBS view
                app.innerHTML = `
                    <div class="w-screen h-screen overflow-hidden bg-transparent p-6 flex flex-col justify-between">
                        ${renderLayoutContent()}
                    </div>
                `;
            } else {
                // Generator Studio View
                app.innerHTML = `
                    <header class="bg-slate-900 border-b border-slate-800 px-6 py-4 flex items-center justify-between sticky top-0 z-50">
                        <div class="flex items-center space-x-3">
                            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-purple-600 to-pink-500 flex items-center justify-center shadow-lg shadow-purple-500/30">
                                <i class="fa-solid fa-sliders text-white text-lg"></i>
                            </div>
                            <div>
                                <h1 class="font-bold text-lg tracking-tight text-white">Stream Layout Studio</h1>
                                <p class="text-xs text-slate-400">Configure your professional OBS overlay layout in real-time</p>
                            </div>
                        </div>
                        <div class="flex items-center space-x-3">
                            <button onclick="openOBSView()" class="px-4 py-2 bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 text-white font-medium text-sm rounded-xl shadow-lg shadow-purple-600/20 transition-all flex items-center space-x-2">
                                <i class="fa-solid fa-arrow-up-right-from-square"></i>
                                <span>Open OBS Browser Source URL</span>
                            </button>
                        </div>
                    </header>

                    <main class="flex-1 flex flex-col lg:flex-row overflow-hidden">
                        <!-- Controls Sidebar -->
                        <aside class="w-full lg:w-96 bg-slate-900/80 backdrop-blur-md border-r border-slate-800 p-6 overflow-y-auto space-y-6">
                            <div>
                                <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-4 flex items-center space-x-2">
                                    <i class="fa-solid fa-display text-purple-400"></i>
                                    <span>Stream Info</span>
                                </h2>
                                <div class="space-y-4">
                                    <div>
                                        <label class="block text-xs font-medium text-slate-300 mb-1">Game Title / Header</label>
                                        <input type="text" id="inputGameTitle" value="${escapeHtml(state.gameTitle)}" oninput="updateState('gameTitle', this.value)" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-purple-500 transition-colors">
                                    </div>
                                    <div>
                                        <label class="block text-xs font-medium text-slate-300 mb-1">Category / Subtitle</label>
                                        <input type="text" id="inputGameSub" value="${escapeHtml(state.gameSubtitle)}" oninput="updateState('gameSubtitle', this.value)" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-purple-500 transition-colors">
                                    </div>
                                </div>
                            </div>

                            <hr class="border-slate-800">

                            <div>
                                <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-4 flex items-center space-x-2">
                                    <i class="fa-solid fa-layer-group text-purple-400"></i>
                                    <span>Layout Modules</span>
                                </h2>
                                <div class="space-y-3">
                                    <label class="flex items-center justify-between p-3 bg-slate-950 border border-slate-800/80 rounded-xl cursor-pointer hover:border-slate-700 transition-all">
                                        <span class="text-sm font-medium text-slate-200 flex items-center space-x-2">
                                            <i class="fa-solid fa-video text-pink-400 w-5"></i>
                                            <span>Facecam Frame</span>
                                        </span>
                                        <input type="checkbox" ${state.showFacecam ? 'checked' : ''} onchange="toggleModule('showFacecam', this.checked)" class="w-4 h-4 rounded text-purple-600 focus:ring-purple-500 bg-slate-900 border-slate-700">
                                    </label>

                                    <label class="flex items-center justify-between p-3 bg-slate-950 border border-slate-800/80 rounded-xl cursor-pointer hover:border-slate-700 transition-all">
                                        <span class="text-sm font-medium text-slate-200 flex items-center space-x-2">
                                            <i class="fa-solid fa-clock text-blue-400 w-5"></i>
                                            <span>Clock Card</span>
                                        </span>
                                        <input type="checkbox" ${state.showClock ? 'checked' : ''} onchange="toggleModule('showClock', this.checked)" class="w-4 h-4 rounded text-purple-600 focus:ring-purple-500 bg-slate-900 border-slate-700">
                                    </label>

                                    <label class="flex items-center justify-between p-3 bg-slate-950 border border-slate-800/80 rounded-xl cursor-pointer hover:border-slate-700 transition-all">
                                        <span class="text-sm font-medium text-slate-200 flex items-center space-x-2">
                                            <i class="fa-solid fa-stopwatch text-emerald-400 w-5"></i>
                                            <span>Timer / Uptime Card</span>
                                        </span>
                                        <input type="checkbox" ${state.showTimer ? 'checked' : ''} onchange="toggleModule('showTimer', this.checked)" class="w-4 h-4 rounded text-purple-600 focus:ring-purple-500 bg-slate-900 border-slate-700">
                                    </label>
                                </div>
                            </div>

                            <hr class="border-slate-800">

                            <div>
                                <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-4 flex items-center space-x-2">
                                    <i class="fa-solid fa-stopwatch text-purple-400"></i>
                                    <span>Timer Settings</span>
                                </h2>
                                <div class="space-y-4">
                                    <div>
                                        <label class="block text-xs font-medium text-slate-300 mb-1">Timer Mode</label>
                                        <select onchange="updateState('timerMode', this.value)" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-purple-500 transition-colors">
                                            <option value="countdown" ${state.timerMode === 'countdown' ? 'selected' : ''}>Countdown Timer</option>
                                            <option value="countup" ${state.timerMode === 'countup' ? 'selected' : ''}>Countup Uptime</option>
                                        </select>
                                    </div>
                                    ${state.timerMode === 'countdown' ? `
                                    <div>
                                        <label class="block text-xs font-medium text-slate-300 mb-1">Duration (Minutes)</label>
                                        <div class="flex items-center space-x-2">
                                            <input type="number" min="1" max="180" value="${Math.floor(state.countdownRemaining / 60)}" onchange="updateTimerMinutes(this.value)" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-purple-500 transition-colors">
                                            <button onclick="resetTimer()" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs rounded-xl font-medium transition-colors">Reset</button>
                                        </div>
                                    </div>
                                    ` : ''}
                                </div>
                            </div>
                        </aside>

                        <!-- Preview Area -->
                        <div class="flex-1 bg-slate-900 p-6 flex flex-col items-center justify-center overflow-auto relative">
                            <div class="absolute top-4 left-6 text-xs text-slate-400 flex items-center space-x-2">
                                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                                <span>Live Preview (16:9 Aspect ratio container)</span>
                            </div>

                            <div class="w-full max-w-5xl aspect-video bg-slate-950 border border-slate-800/80 rounded-2xl overflow-hidden shadow-2xl relative flex flex-col justify-between p-6">
                                ${renderLayoutContent()}
                            </div>
                        </div>
                    </main>
                `;
            }
        }

        function renderLayoutContent() {
            // Determine right column arrangement based on rules:
            // 1. Facecam is ALWAYS at top-right with its own see-through frame & corner. Gameplay cannot overlap it.
            // 2. If facecam is disabled AND one of the sidebar widgets (Clock or Timer) is left alone/active,
            //    that remaining widget must move down to the bottom part of the right column, and gameplay becomes wider.
            // 3. If BOTH clock and timer are enabled alongside facecam disabled, they split the right column vertically.
            // 4. If everything in the right column except facecam is disabled, right column is empty or hidden, gameplay fills width.

            const hasFacecam = state.showFacecam;
            const hasClock = state.showClock;
            const hasTimer = state.showTimer;

            let rightColContent = '';
            let rightColClass = "w-72 flex flex-col space-y-4 shrink-0 transition-all duration-300";
            let gameColClass = "flex-1 mr-4 transition-all duration-300";

            if (!hasFacecam && !hasClock && !hasTimer) {
                // Nothing in right col
                rightColClass = "hidden";
                gameColClass = "w-full";
            } else if (!hasFacecam && (hasClock !== hasTimer)) {
                // Exactly ONE sidebar widget active while facecam is disabled -> Move to bottom of right column!
                rightColClass = "w-72 flex flex-col justify-end shrink-0 transition-all duration-300";
            }

            // Build right column inner HTML
            let innerRightHtml = '';

            if (hasFacecam) {
                innerRightHtml += `
                    <div class="w-full aspect-[4/3] bg-slate-900/40 backdrop-blur-sm border border-slate-700/50 rounded-2xl relative flex items-center justify-center glow-border shadow-lg">
                        <div class="corner-bracket corner-tl"></div>
                        <div class="corner-bracket corner-tr"></div>
                        <div class="corner-bracket corner-bl"></div>
                        <div class="corner-bracket corner-br"></div>
                        <div class="text-slate-500 font-mono text-xs tracking-wider flex flex-col items-center space-y-1">
                            <i class="fa-solid fa-video text-slate-600 text-lg"></i>
                            <span>FACECAM</span>
                        </div>
                    </div>
                `;
            }

            let widgetsHtml = '';
            if (hasClock) {
                widgetsHtml += `
                    <div class="w-full bg-slate-900/60 backdrop-blur-md border border-slate-800 rounded-xl p-4 flex items-center justify-between shadow-md">
                        <div class="flex items-center space-x-2 text-xs font-semibold text-slate-400 tracking-wider">
                            <i class="fa-solid fa-clock text-blue-400"></i>
                            <span>LOCAL TIME</span>
                        </div>
                        <div class="font-mono text-sm font-bold text-white tracking-widest">${formatClock()}</div>
                    </div>
                `;
            }

            if (hasTimer) {
                widgetsHtml += `
                    <div class="w-full bg-slate-900/60 backdrop-blur-md border border-slate-800 rounded-xl p-4 flex items-center justify-between shadow-md">
                        <div class="flex items-center space-x-2 text-xs font-semibold text-slate-400 tracking-wider">
                            <i class="fa-solid fa-${state.timerMode === 'countdown' ? 'hourglass-half' : 'stopwatch'} text-emerald-400"></i>
                            <span>${state.timerMode === 'countdown' ? 'COUNTDOWN' : 'UPTIME'}</span>
                        </div>
                        <div class="font-mono text-sm font-bold text-white tracking-widest">${formatTimer()}</div>
                    </div>
                `;
            }

            innerRightHtml += widgetsHtml;

            return `
                <!-- Main Top Section (Game & Right Sidebar) -->
                <div class="flex-1 flex overflow-hidden mb-4">
                    <!-- Game Window -->
                    <div class="${gameColClass} bg-slate-900/40 backdrop-blur-sm border border-slate-800/80 rounded-2xl relative flex items-center justify-center shadow-2xl overflow-hidden">
                        <div class="absolute inset-0 bg-gradient-to-br from-purple-500/5 via-transparent to-pink-500/5 pointer-events-none"></div>
                        <div class="text-slate-600 font-mono text-sm tracking-widest uppercase flex flex-col items-center space-y-2">
                            <i class="fa-solid fa-gamepad text-2xl text-slate-700"></i>
                            <span>Game Frame</span>
                        </div>
                    </div>

                    <!-- Right Column (Facecam & Widgets) -->
                    ${(hasFacecam || hasClock || hasTimer) ? `
                    <div class="${rightColClass}">
                        ${innerRightHtml}
                    </div>
                    ` : ''}
                </div>

                <!-- Bottom Title Strip -->
                <div class="w-full bg-slate-900/80 backdrop-blur-md border border-slate-800 rounded-2xl px-6 py-4 flex items-center justify-between shadow-xl">
                    <div class="flex items-center space-x-4">
                        <div class="px-3 py-1 bg-red-600/20 border border-red-500/30 rounded-full flex items-center space-x-2">
                            <span class="w-2 h-2 rounded-full bg-red-500 animate-ping"></span>
                            <span class="text-xs font-bold text-red-400 tracking-wider">LIVE</span>
                        </div>
                        <div>
                            <h3 class="font-bold text-sm tracking-wide text-white">${escapeHtml(state.gameTitle)}</h3>
                            <p class="text-xs text-purple-400 font-medium">${escapeHtml(state.gameSubtitle)}</p>
                        </div>
                    </div>
                    <div class="flex items-center space-x-3 text-slate-400 text-xs font-mono">
                        <span>1080p60</span>
                        <span>•</span>
                        <span>OBS Studio</span>
                    </div>
                </div>
            `;
        }

        // State update handlers
        function updateState(key, val) {
            state[key] = val;
            saveState();
            render();
        }

        function toggleModule(key, val) {
            state[key] = val;
            saveState();
            render();
        }

        function updateTimerMinutes(mins) {
            const m = parseInt(mins) || 15;
            state.timerMinutes = m;
            state.countdownRemaining = m * 60;
            saveState();
            render();
        }

        function resetTimer() {
            state.countdownRemaining = state.timerMinutes * 60;
            state.uptimeSeconds = 0;
            render();
        }

        function openOBSView() {
            const currentUrl = window.location.href.split('?')[0];
            const viewUrl = currentUrl + '?view=1';
            window.open(viewUrl, '_blank', 'width=1280,height=720');
        }

        function escapeHtml(str) {
            return (str || '').replace('&', '&amp;').replace('<', '&lt;').replace('>', '&gt;').replace('"', '&quot;');
        }

        // Initial render
        render();

        // Refresh clock/timers every second in generator/view mode
        setInterval(() => {
            render();
        }, 1000);
    </script>
</body>
</html>
